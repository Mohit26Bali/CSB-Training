spring.application.name=cartnest-api
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# The MySQL password and the JWT signing key live in git-ignored files
spring.config.import=optional:classpath:db-secret.properties,optional:classpath:jwt-secret.properties

# Flyway creates the tables and loads the catalogue (db/migration); Hibernate only checks the mapping
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Loads lazy collections (variants, images) for up to 50 products in one query instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------- Login ----------------
# How long a login token stays valid
app.jwt.validity=PT12H
# Failed logins allowed for one email before it is locked for a while
app.login.max-failures=5
app.login.lock-duration=PT15M

# ---------------- Front end ----------------
app.cors.allowed-origins=http://localhost:5173

# Demo orders for a fresh development database (see DemoOrderSeeder)
app.seed.demo-orders=true
