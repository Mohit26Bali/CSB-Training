server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # The registry does not register with itself
    register-with-eureka: false
    fetch-registry: false
  server:
    # Remove stopped instances quickly so the demos react within seconds (training values)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
