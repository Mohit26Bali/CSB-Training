# Build the jars first: mvn clean package -DskipTests
services:
  eureka-server:
    build: ./eureka-server
    image: microservices-demo/eureka-server:1.0.0
    ports:
      - "8761:8761"

  product-service-1:
    build: ./product-service
    image: microservices-demo/product-service:1.0.0
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      INSTANCE_NAME: product-service-1
    depends_on:
      - eureka-server

  # Second instance of the same image, registered under the same service ID
  product-service-2:
    image: microservices-demo/product-service:1.0.0
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      INSTANCE_NAME: product-service-2
    depends_on:
      - product-service-1

  order-service:
    build: ./order-service
    image: microservices-demo/order-service:1.0.0
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    # Published on localhost only, for the Actuator circuit-breaker endpoints; clients use the gateway.
    # Host port 18081, so it does not clash with a locally running order-service (or anything else) on 8081
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      - eureka-server

  api-gateway:
    build: ./api-gateway
    image: microservices-demo/api-gateway:1.0.0
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
