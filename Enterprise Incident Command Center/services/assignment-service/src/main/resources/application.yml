server:
  port: 8082

spring:
  application:
    name: assignment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/icc_assignment
    username: ${DB_USER:icc}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always

icc:
  security:
    public-paths: /api/auth/login,/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health

# OpenAPI description (D24). Open for local development; the gateway has no route for these paths, so they are
# not reachable through port 8080. Switch them off or protect them in any real deployment.
springdoc:
  paths-to-exclude: /internal/**   # service-to-service endpoints are not part of the contract
