server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: assignment-service
              uri: lb://assignment-service
              predicates:
                - Path=/api/auth/**, /api/users/**, /api/teams/**, /api/assignment-rules/**, /api/assignment/**
            - id: incident-service
              uri: lb://incident-service
              predicates:
                - Path=/api/incidents/**
            - id: major-incident-service
              uri: lb://major-incident-service
              predicates:
                - Path=/api/major-incidents/**
            - id: rca-service
              uri: lb://rca-service
              predicates:
                - Path=/api/problems/**
            - id: dashboard-service
              uri: lb://dashboard-service
              predicates:
                - Path=/api/dashboard/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

icc:
  security:
    public-paths: /api/auth/login,/actuator/health
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
