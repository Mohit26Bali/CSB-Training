spring.application.name=complaints
server.port=8117

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_portal?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mohit123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: override JWT_SECRET in any real deployment (min 32 characters)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=60

# Comma-separated list of origins allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5117}

# Login throttling
app.security.max-login-attempts=5
app.security.lockout-minutes=15

# Seed demo users and sample data when the tables are empty
app.seed.enabled=true
