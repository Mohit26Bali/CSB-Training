spring.application.name=food-delivery
server.port=8101

# Database. The credentials have NO defaults: set DB_USERNAME and DB_PASSWORD (and, outside local use, DB_URL).
# For local development run with the `dev` profile (see README), which only needs DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: JWT_SECRET is required (32+ characters). There is deliberately no default, so a forgotten variable stops the app
# instead of running with a key that anyone can read in the repository.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Comma-separated list of origins allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5101}

# Login throttling
app.security.max-login-attempts=5
app.security.lockout-minutes=15

# The restaurant's time zone: order times and "today" in the sales figures follow it
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Demo users and sample data (published passwords!). Off unless SEED_DEMO_DATA=true or the `dev` profile is active.
app.seed.enabled=${SEED_DEMO_DATA:false}

# Every log line carries the request id that is also returned in the X-Request-Id header
logging.pattern.level=%5p [%X{rid:-}]
