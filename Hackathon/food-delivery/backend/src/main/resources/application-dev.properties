# Local development only. Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev   (or run-dev.cmd)
#
# You still set the database password yourself, in your own shell, so it never lives in this repository:
#   PowerShell:  $env:DB_PASSWORD = "your MySQL password"
#   bash:        export DB_PASSWORD="your MySQL password"
# Better still: create a dedicated MySQL user for this app and use DB_USERNAME / DB_PASSWORD for it instead of root.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# A fixed key is fine for a laptop. It is public, so the dev profile must never be used on a shared or public server.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

# Seed the demo accounts and sample orders
app.seed.enabled=true
