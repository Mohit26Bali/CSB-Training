# Tests run against in-memory H2, so no MySQL is needed.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.seed.enabled=false

# Tests need their own (non-secret) key and time zone now that the main properties have no defaults
app.jwt.secret=test-only-secret-test-only-secret-test-only
app.timezone=Asia/Kolkata
