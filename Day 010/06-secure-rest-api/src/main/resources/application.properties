spring.application.name=secure-rest-api
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/hr_secure_day10?createDatabaseIfNotExist=true
spring.datasource.username=root
# MySQL password and JWT key: git-ignored files
spring.config.import=optional:classpath:db-secret.properties,optional:classpath:jwt-secret.properties

spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------- JWT ----------------
portal.jwt.issuer=hr-portal
portal.jwt.access-token-ttl=PT15M

# ---------------- Logging ----------------
# Every log line shows the request's correlation id (from the MDC)
logging.pattern.level=%5p [%X{correlationId:-}]
# Structured security events (401 / 403 / salary changes / user administration)
logging.level.security.audit=INFO
