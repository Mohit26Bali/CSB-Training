# =====================================================================
# Settings used ONLY by the tests (this file replaces the main
# application.properties on the test classpath).
#
# Separate database hr_jwt_day10_test, wiped and rebuilt by TestFlywayConfig.
# The test signing keys below are NOT the real ones (those are in the
# git-ignored jwt-secret.properties): they exist only to sign test tokens.
# =====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/hr_jwt_day10_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

portal.jwt.issuer=hr-portal
portal.jwt.access-token-ttl=PT15M
portal.jwt.refresh-token-ttl=P7D
portal.jwt.clock-skew=PT30S
portal.jwt.active-key-id=test-new
# an older key that still verifies (key rotation tests)
portal.jwt.keys.test-old=AeludZkShccE0zyEptBRXGyI90ZEwlbmJ9jqSQuorVM=
portal.jwt.keys.test-new=ULtALDPg3dAtCdsYgusldJC9Id95yyvQiX+uaSqsGLQ=

# cost 10 keeps the test logins fast
portal.bcrypt-strength=10
