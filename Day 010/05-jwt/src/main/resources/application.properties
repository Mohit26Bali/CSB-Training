spring.application.name=jwt-auth
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/hr_jwt_day10?createDatabaseIfNotExist=true
spring.datasource.username=root
# The MySQL password and the JWT signing keys are kept in git-ignored files
spring.config.import=optional:classpath:db-secret.properties,optional:classpath:jwt-secret.properties

# ---------------- Flyway / JPA ----------------
#   db/migration : V1 users/roles/permissions, V2 refresh tokens
#   db/sample    : V1_1 demo users
spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------- JWT (externalised: each can be overridden by an environment variable) ----------------
# "iss" claim: written into every token and required on every token read
portal.jwt.issuer=hr-portal
# Access tokens are short-lived: a JWT cannot be recalled once issued
portal.jwt.access-token-ttl=PT15M
# Refresh tokens live longer: they are stored in MySQL and can be revoked
portal.jwt.refresh-token-ttl=P7D
# Tolerance for clocks that differ slightly between servers
portal.jwt.clock-skew=PT30S
# The key that signs NEW tokens. The keys themselves are in jwt-secret.properties:
#   portal.jwt.keys.<key-id>=<Base64 of 32 random bytes>
portal.jwt.active-key-id=k2026-10

# BCrypt cost for new hashes (the password is checked once per login, not per request)
portal.bcrypt-strength=12

# ---------------- Logging ----------------
logging.level.org.springframework.security=INFO
