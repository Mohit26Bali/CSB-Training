# Single configuration file for the backend. Who reads what:
#   spring.datasource.* / spring.jpa.*   -> Spring Boot auto-config, used by entity/ + repository/
#   spring.flyway.*                      -> Flyway, runs db/migration scripts at startup, before JPA starts
#   springdoc.*                          -> Swagger UI / OpenAPI docs (config/OpenApiConfig)
#   app.jwt.*                            -> security/JwtService
#   app.cors.allowed-origins             -> config/SecurityConfig (CORS bean, for the React dev server)
#   app.security.*                       -> service/LoginAttemptService
#   app.seed.enabled                     -> config/DataInitializer
# Tests override these through src/test/resources/application-test.properties (H2, no seeding).

spring.application.name=banking

# MySQL database "bank". DB_PASSWORD is REQUIRED (no default); DB_URL and DB_USERNAME can be overridden.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration/{vendor}). Hibernate only VALIDATES that the entities
# match the tables. A database that already has the tables but no Flyway history is baselined at version 1.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Lazy relations are only touched inside @Transactional services, never in controllers.
spring.jpa.open-in-view=false

# API docs (Swagger UI /swagger-ui.html, OpenAPI /v3/api-docs). Set SWAGGER_ENABLED=false in production.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method

# JWT: JWT_SECRET is REQUIRED (at least 32 random characters). There is deliberately no default, so a deployment can never
# sign tokens with a published key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=30

# Comma-separated list of browser origins allowed to call the API (Vite dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Brute-force protection on login
app.security.max-login-attempts=5
app.security.lockout-minutes=15

# Create the demo admin, customers and accounts when the users table is empty
# Demo admin, customers and accounts (published passwords): OFF unless asked for. Local use: SEED_DEMO_DATA=true
app.seed.enabled=${SEED_DEMO_DATA:false}
