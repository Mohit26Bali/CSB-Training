# Activated by @ActiveProfiles("test"). Replaces the MySQL settings of src/main/resources/application.properties
# with an in-memory H2 database so tests are self-contained.
spring.datasource.url=jdbc:h2:mem:banktest;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Same as production: Flyway builds the schema from db/migration/h2, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Tests create their own data; config/DataInitializer must stay quiet.
app.seed.enabled=false

# Test-only value (the real one is never committed)
app.jwt.secret=test-only-secret-for-automated-tests-0123456789
