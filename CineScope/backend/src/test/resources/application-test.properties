# Activated by @ActiveProfiles("test") on the API tests. Replaces the MySQL settings of src/main/resources/application.properties
# with an in-memory H2 database, so the tests never touch the real "cinescope" database. Flyway builds the schema from
# db/migration/h2 and Hibernate only validates it, exactly as in production.
spring.datasource.url=jdbc:h2:mem:cinescopetest;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# The tests log in repeatedly; the lockout itself is tested separately with its own small limit.
app.security.max-login-attempts=1000

# Test-only values (the real ones are never committed)
app.jwt.secret=test-only-secret-for-automated-tests-0123456789
