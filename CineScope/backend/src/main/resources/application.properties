# Single configuration file of the backend. Who reads what:
#   server.port                  -> embedded Tomcat (8095, so CineScope can run next to other local apps)
#   tmdb.*                       -> config/TmdbProperties, used by config/TmdbClientConfig and tmdb/TmdbHttpGateway
#   cinescope.*                  -> service/CatalogService (default country / language)
#   spring.datasource.* / spring.jpa.* -> Spring Boot auto-config, used by entity/ + repository/ (MySQL "cinescope")
#   spring.flyway.*              -> Flyway: runs db/migration scripts at startup, before JPA starts
#   app.jwt.*                    -> security/JwtService
#   app.cors.allowed-origins     -> config/SecurityConfig (CORS bean)
#   app.security.*               -> service/LoginAttemptService
#   springdoc.*                  -> Swagger UI and OpenAPI document (config/OpenApiConfig)
# Secrets (the TMDB token, optionally the database password) are NOT here: put them in backend/config/application.properties
# (git-ignored; see the .example file next to it) or in environment variables.
# Automated tests override the database through src/test/resources/application-test.properties (in-memory H2).

spring.application.name=cinescope
server.port=${SERVER_PORT:8095}
# CineScope keeps no server-side sessions (login is a JWT), so there is nothing to save. Spring DevTools turns session saving on by
# default, which makes Tomcat use a folder in the system temp directory; that fails with "is not owned by BUILTIN\Administrators"
# when the app is started from an administrator terminal after a normal one (or the other way round).
server.servlet.session.persistent=false

# --- TMDB (https://developer.themoviedb.org) ---
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.read-token=${TMDB_READ_TOKEN:}
tmdb.connect-timeout-ms=3000
tmdb.read-timeout-ms=8000

# --- CineScope defaults ---
# Country used for "now playing", "upcoming" and (later) streaming availability. A user can change it in their profile.
cinescope.default-region=IN
cinescope.language=en-US

# --- Database: MySQL "cinescope" (create it once: CREATE DATABASE cinescope;). Override with environment variables. ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinescope}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration/{vendor}). Hibernate only VALIDATES that the entities
# match the tables, and refuses to start if they do not.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Lazy relations are only touched inside @Transactional services, never in controllers.
spring.jpa.open-in-view=false

# --- Login sessions (JWT) ---
# REQUIRED: set JWT_SECRET (at least 32 random characters) as an environment variable or in the git-ignored
# config/application.properties. There is deliberately no default, so a deployment cannot sign tokens with a published key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=720

# Comma-separated list of browser origins allowed to call the API directly (the Vite dev server normally uses its proxy).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5180}

# Demo accounts (asha, ravi, meera, sam, karan) with ready-made watchlists: config/DemoDataInitializer. OFF unless asked for,
# so a real deployment never gets accounts with a published password. Local use: SEED_DEMO_DATA=true.
app.seed.demo-data=${SEED_DEMO_DATA:false}

# The very first administrator: name an EXISTING account and it becomes an ADMIN on start-up (config/AdminBootstrap).
# Leave empty normally. Local use: INITIAL_ADMIN=asha
app.security.initial-admin=${INITIAL_ADMIN:}

# Brute-force protection on login
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lockout-minutes=15

# --- Swagger UI: /swagger-ui.html, OpenAPI JSON: /v3/api-docs (set SWAGGER_ENABLED=false in production) ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
