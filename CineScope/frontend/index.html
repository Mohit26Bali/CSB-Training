<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CineScope - discover movies and TV shows: trending, trailers, cast and more." />
    <meta name="theme-color" content="#0a0b10" />
    <title>CineScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <script>
      // CineScope is dark by default (it is a cinema, after all). Apply the saved choice before first paint so the page
      // never flashes the wrong theme. Same storage key as src/theme.ts.
      try {
        if (localStorage.getItem('cinescope.theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
