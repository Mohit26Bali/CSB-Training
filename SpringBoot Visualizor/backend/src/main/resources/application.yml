spring:
  application:
    name: springlab
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:springlab}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:springlab}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that entities match it.
      ddl-auto: validate
    # Disabled so lazy loading behaves as it would in a real service layer (no session during view rendering).
    open-in-view: false
    properties:
      # Learning lab only: records the SQL text of a request that opted in to tracing; a no-op for every other request.
      hibernate.session_factory.statement_inspector: com.springlab.lab.sql.CapturingStatementInspector
  flyway:
    enabled: true

springlab:
  jwt:
    # No default on purpose: the application refuses to start without JWT_SECRET (min. 32 bytes for HS256).
    secret: ${JWT_SECRET}
    issuer: springlab
    access-token-ttl: 30m
  # Optional. Set all three (environment variables) to create the first ADMIN when none exists. No defaults.
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

spring.data.web.pageable.max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
